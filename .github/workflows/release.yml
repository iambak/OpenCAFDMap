# Push a version tag (e.g. git tag v1.0.0 && git push origin v1.0.0) to publish a GitHub Release with
# OpenCAFDMap.zip, its SHA-256 and OpenLauncher-Setup.bat (which installs the latest release).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ocm/check_names.py
      - run: python ocm/defs_manifest.py --check
      - run: python installer/build_release.py "${{ github.ref_name }}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Install
          1. Download **OpenLauncher-Setup.bat** below and double-click it.
             Windows may warn about a downloaded file: choose *More info* / *Run anyway* if you trust it.
          2. Pick the install folder (default: %LOCALAPPDATA%\\OpenCAFDMap). Setup checks for Python 3.10+
             (it can install it with winget), downloads **OpenCAFDMap.zip**, verifies its SHA-256 and
             creates Desktop / Start menu shortcuts.
          3. In OpenLauncher: set your E-Sys folder and press **Start E-Sys with Open CAFD Map**. No build is needed for E-Sys;
             **Build definitions** is only required for the BimmerCode Backup Editor and the command-line tools.

          **Upgrading:** run setup again; your workspace and settings are kept.
          **Manual install:** extract OpenCAFDMap.zip anywhere and run OpenLauncher.bat.
          Definition updates (names) arrive through OpenLauncher's **Check for updates** without reinstalling.
          EOF
          assets="dist/OpenCAFDMap.zip dist/OpenCAFDMap.zip.sha256 installer/OpenLauncher-Setup.bat"
          extra=""
          case "$TAG" in
            *-*)
              # a tag with a suffix (v3.0.0-beta.1) is a preview: a pre-release, never "latest", so setup and
              # OpenLauncher's normal updates keep installing the stable release. No setup attached: the stable
              # release's setup installs it (OCM_SETUP_TAG), and a setup here would install the stable release.
              assets="dist/OpenCAFDMap.zip dist/OpenCAFDMap.zip.sha256"
              extra="--prerelease --latest=false"
              cat > notes.md <<EOF
          ## Preview - not the stable release
          **Try it:** in OpenLauncher, **Updates > Try OpenLauncher v3** (needs OpenLauncher 2.3.4 or newer).
          Your workspace and settings are kept.

          **Go back:** in v3, **Updates > Back to stable** installs the latest stable release.

          **Without OpenLauncher:** download OpenLauncher-Setup.bat from the latest stable release and run it with
          the environment variable OCM_SETUP_TAG=$TAG set, or extract OpenCAFDMap.zip and run OpenLauncher.bat.
          EOF
              ;;
          esac
          gh release create "$TAG" $assets --title "OpenLauncher $TAG" --notes-file notes.md --generate-notes $extra
